[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-curation"
version = "0.1.0"
description = "Audio training data curation pipeline"
authors = [{name = "Kartik Munjal", email = "kartikmunjal19@gmail.com"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "librosa>=0.10.1,<1",
  "numpy>=1.24,<3",
  "pandas>=2,<4",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "soundfile>=0.12.1,<1",
  "tqdm>=4.65,<5",
  "jiwer>=3,<5",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "pyarrow>=15,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
synthetic = ["edge-tts>=6.1,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
